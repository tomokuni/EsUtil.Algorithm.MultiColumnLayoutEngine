# EsUtil.Algorithm.MultiColumnLayoutEngine のビルドワークフロー
#
# push（main / dev / release/*）と Pull Request のたびに、復元・Release ビルド・全テストを実行し、
# 生成されたパッケージ（nupkg）をアーティファクトとして保管する（NuGet.org への登録は行わない）。
#
# 本ワークフローは「検証」だけを行い、公開は release.yml が publish.yml を通じて行う。
# この実行結果はリリースの前提（ゲート）になる。Release ワークフローは、リリース対象コミットに対する
# 本ワークフローの成功実行が存在することを確認してから Release を作成する。
#
# パッケージング（dotnet pack）も本ワークフローで検証する。
# 本ワークフローの成功は「パッケージが作成できる」ことも意味する。
#
# README の「build」バッジはこのワークフローの status を表示する（badge.svg?branch=main）。
name: Build

on:
  push:
    branches: [main, dev, 'release/**']
  pull_request:
    branches: [main]
  # 手動実行（バージョンコミットの検証を起動する場合にも使用する）
  workflow_dispatch:

permissions:
  contents: read

# 同一ブランチの古い実行は打ち切る（バッジは最新の実行結果を表示する）
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v5
        with:
          # ライブラリとテストは共に net10.0（C# 14）を対象とする
          dotnet-version: '10.0.x'

      - name: 保管期間を設定から読む
        id: config
        run: echo "retention=$(jq -r .artifactRetentionDays .github/release-config.json)" >> "$GITHUB_OUTPUT"

      # 以降は --no-restore / --no-build で工程を分け、失敗箇所を切り分けやすくする
      - name: 復元
        run: dotnet restore MultiColumnLayoutEngine.slnx

      - name: ビルド（Release）
        run: dotnet build MultiColumnLayoutEngine.slnx -c Release --no-restore

      - name: テスト（Release）
        run: dotnet test MultiColumnLayoutEngine.slnx -c Release --no-build

      # 公開はしないが、pack が通ることを検証し、内容の確認用に nupkg を保管する
      - name: パッケージを作成
        run: dotnet pack src/MultiColumnLayoutEngine.csproj -c Release --no-build -o ./artifacts

      - name: パッケージを保管
        uses: actions/upload-artifact@v6
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: ${{ steps.config.outputs.retention }}
