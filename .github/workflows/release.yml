# EsUtil.Algorithm.MultiColumnLayoutEngine のリリースワークフロー
#
# 自動インクリメントは行わない。実行は手動（Actions → Release → Run workflow）のみで、
# **main ブランチからのみ実行できる**（それ以外のブランチでは検証で失敗する）。
# 責務ごとにジョブを分ける。失敗してもタグと Release は作成されない。
#
#   verify  … 前提検証（ブランチ / ゲート / バージョン / タグ未作成）
#   publish … 全パッケージを pack して NuGet.org / GitHub Packages へ公開（実装は publish.yml に集約）
#   release … バージョンをコミットして push し、タグと GitHub Release を作成する
#
# バージョンが未入力の場合は「ドライラン」として、現在のバージョン状況の表示だけを行い、
# publish と release は実行しない（入力フォームに現在の値を表示できないため、先に確認する手段として使う）。
#
# 注意: 外部公開（NuGet.org / GitHub Packages）は、バージョンコミットとタグ作成より前に実行する。
# NuGet は同じバージョンを再利用できないため、公開に失敗してもタグとバージョンを消費しないようにする。
# 各公開は --skip-duplicate で冪等にしてあり、同じバージョンで再実行すると未完了分だけが進む。
# また、タグは gh release create --target に作成させる（公開の成功後にのみタグが作られる）。
#
# GITHUB_TOKEN による push はワークフローを再トリガーしないため、Build が連鎖起動しない。
#
# .NET SDK のバージョンはリポジトリルートの global.json が単一所有する（ワークフローでは指定しない）。
name: Release

# 実行一覧にバージョンを表示する（未入力のドライランはその旨を表示する）
run-name: Release ${{ inputs.version || '（現在のバージョンを確認）' }}

on:
  # 手動実行のみ。バージョンは入力で指定する（自動インクリメントは行わない）
  workflow_dispatch:
    inputs:
      version:
        # 入力フォームには現在の値を表示できない（default に式を指定できない）ため、
        # 未入力のまま実行すると「現在のバージョン状況の表示」だけを行うドライランになる
        description: 'リリースするバージョン（例: 1.0.1 / 1.1.0 / 2.0.0 / 1.2.3-rc.1）。未入力のまま実行すると、リリースを行わず現在のバージョン（タグ・公開状況）だけを Summary に表示します'
        required: false
        type: string

# リリース処理は同時に 1 つだけ実行する
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. 前提検証
  # ────────────────────────────────────────────────────────────
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Build（ゲート）の実行結果の参照
      actions: read
    outputs:
      # 'true' の場合はドライラン（バージョン未入力。表示のみでリリースは行わない）
      dry_run: ${{ steps.mode.outputs.dry_run }}
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
      notes_start_tag: ${{ steps.verify.outputs.notes_start_tag }}
      is_backport: ${{ steps.verify.outputs.is_backport }}
      update_version_file: ${{ steps.verify.outputs.update_version_file }}
      mark_latest: ${{ steps.verify.outputs.mark_latest }}
      gate_workflow: ${{ steps.config.outputs.gate_workflow }}
      version_file: ${{ steps.config.outputs.version_file }}
      product: ${{ steps.config.outputs.product }}
      release_notes: ${{ steps.config.outputs.release_notes }}
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
        with:
          # タグの列挙のため全履歴を取得する
          fetch-depth: 0

      # 「現在のバージョン状況」の表示で dotnet msbuild（PackageId の取得）を使うため、先に SDK を入れる
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v5

      # リリース設定（バージョンファイル・表示名・説明・ブランチ・ゲート）は release-config.json が単一所有する
      - name: リリース設定を読む
        id: config
        uses: ./.github/actions/read-config

      # バージョンが未入力ならドライラン（現在のバージョン状況の表示だけを行う）
      - name: 実行モードを判定
        id: mode
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # 未入力（空白のみを含む）ならドライラン
          $dryRun = [string]::IsNullOrWhiteSpace($env:INPUT_VERSION)
          # 注意: 文字列補間の $() の外に続くメソッド呼び出しは評価されないため、値を変数へ入れてから出力する
          $dryRunText = if ($dryRun) { 'true' } else { 'false' }

          "dry_run=$dryRunText" >> $env:GITHUB_OUTPUT

          if ($dryRun) {
            Write-Host 'バージョンが未入力のため、ドライランとして実行します（現在のバージョン状況の表示のみ。リリースは行いません）。'
          }
          else {
            Write-Host "リリースするバージョン: $($env:INPUT_VERSION.Trim())"
          }

      # 現在どこまでリリースされているか（バージョン・タグ・GitHub Release・NuGet.org の公開状況）を
      # 実行サマリーへ表示する。入力フォームには現在の値を表示できないため、ここで確認できるようにする
      - name: 現在のバージョン状況を表示
        # 情報の表示のみで状態を変更しないため、問い合わせに失敗してもリリースは続行する
        continue-on-error: true
        shell: pwsh
        env:
          # 最新の GitHub Release の取得（gh release list）に使用する
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: ./.github/scripts/show-current-versions.ps1 -Branch $env:BRANCH

      # ドライランでは検証しない（同じ内容を次回の本実行でも行うため、ここで止める必要がない）
      - name: バージョンとブランチを検証
        id: verify
        if: steps.mode.outputs.dry_run != 'true'
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BRANCH: ${{ github.ref_name }}
        run: |
          $version = $env:INPUT_VERSION.Trim()
          if ([string]::IsNullOrEmpty($version)) { throw 'バージョンが入力されていません。' }

          # 形式・ブランチ（release-config.json の releaseBranches）・単調性（同じ系列の最大より大きいこと）・タグ未作成を検証する
          $info = & ./.github/scripts/verify-release-version.ps1 -Version $version -Branch $env:BRANCH | ConvertFrom-Json

          # 注意: 文字列補間の $() の外に続くメソッド呼び出しは評価されないため、値を変数へ入れてから出力する
          $isPrerelease = if ($info.prerelease) { 'true' } else { 'false' }
          $isBackport = if ($info.isBackport) { 'true' } else { 'false' }
          # main からのバックポートでは、main のバージョンを旧系列へ戻さないようバージョンファイルを書き換えない
          $updateVersionFile = if ($info.updateVersionFile) { 'true' } else { 'false' }
          # GitHub Release の Latest にするのは main からの通常のリリースのみ
          $markLatest = if ($info.markLatest) { 'true' } else { 'false' }

          "version=$($info.version)" >> $env:GITHUB_OUTPUT
          "tag=$($info.tag)" >> $env:GITHUB_OUTPUT
          "notes_start_tag=$($info.notesStartTag)" >> $env:GITHUB_OUTPUT
          # プレリリース（例: 1.2.3-rc.1）は GitHub 上でもプレリリースとして登録する
          "prerelease=$isPrerelease" >> $env:GITHUB_OUTPUT
          "is_backport=$isBackport" >> $env:GITHUB_OUTPUT
          "update_version_file=$updateVersionFile" >> $env:GITHUB_OUTPUT
          "mark_latest=$markLatest" >> $env:GITHUB_OUTPUT

      # ドライランではゲートを確認しない（表示だけのため、ここで失敗させない）
      - name: Build ワークフローの成功を確認（ゲート）
        if: steps.mode.outputs.dry_run != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          GATE_WORKFLOW: ${{ steps.config.outputs.gate_workflow }}
        run: |
          $sha = $env:GITHUB_SHA
          $workflow = $env:GATE_WORKFLOW
          Write-Host "リリース対象コミット: $sha（ブランチ: $env:BRANCH / ゲート: $workflow）"

          # 同一ブランチで成功した実行から、対象コミットをビルドしたものを探す
          $runs = gh run list --workflow=$workflow --branch=$env:BRANCH --status=success --limit=50 --json headSha,event
          if ($LASTEXITCODE -ne 0) {
            throw "実行一覧の取得に失敗しました（gh の権限や接続を確認してください）"
          }

          $hit = ($runs | ConvertFrom-Json) | Where-Object { $_.headSha -eq $sha } | Select-Object -First 1

          if (-not $hit) {
            throw "コミット $sha に対する $workflow の成功実行がありません。先に $env:BRANCH へ push して Build を成功させてください。"
          }

          Write-Host "ゲートOK: $workflow が成功しています（event: $($hit.event)）"

      # ドライラン（バージョン未入力）の場合は、現在のバージョン状況の表示だけで終了する
      - name: ドライランの結果をまとめ
        if: steps.mode.outputs.dry_run == 'true'
        shell: pwsh
        env:
          SUMMARY_BRANCH: ${{ github.ref_name }}
        run: |
          # 注意: ダブルクォートの here-string では、バックティックがエスケープ文字になるため使わない。
          # （`` `$env:X `` は展開されずリテラルになり、`` `v `` は垂直タブになる）
          # シングルクォートの here-string は展開されないため、値を入れる場合は -f を使う。
          # 先頭の空行は、直前に表示した「現在のバージョン状況」との区切り（Out-File -Append のため）
          $message = @'

          ## ドライラン（リリースは行っていません）

          `version` が**未入力**だったため、現在のバージョン状況の表示だけを行いました。
          検証・pack・公開・タグ作成・Release 作成は実行していません。

          ### 次の操作

          上の「現在のバージョン状況」を確認し、`version` にリリースするバージョンを入力して、
          もう一度 **Run workflow** を実行してください。

          - 実行ブランチ: `{0}`
          '@ -f $env:SUMMARY_BRANCH

          $message | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  # ────────────────────────────────────────────────────────────
  # 2. pack して NuGet.org / GitHub Packages へ公開（実装は publish.yml に集約）
  # ────────────────────────────────────────────────────────────
  publish:
    needs: verify
    # ドライラン（バージョン未入力）では公開しない
    if: needs.verify.outputs.dry_run != 'true'
    # 呼び出される publish.yml が必要とする権限をここで付与する（それ以上は与えない）
    permissions:
      contents: read
      # NuGet.org の Trusted Publishing（OIDC）
      id-token: write
      # GitHub Packages
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      # コミット前でも公開物へバージョンを反映する（公開物とリリースのバージョンを一致させる）
      version: ${{ needs.verify.outputs.version }}

  # ────────────────────────────────────────────────────────────
  # 3. バージョンのコミット・push と、タグ + GitHub Release の作成
  # ────────────────────────────────────────────────────────────
  release:
    needs: [verify, publish]
    # ドライラン（バージョン未入力）ではコミット・タグ・Release を作成しない
    if: needs.verify.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      # ブランチ push、タグ作成、Release 作成
      contents: write
      # バージョンコミットの検証（Build）の起動
      actions: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v5
        with:
          # バージョンコミットの push のため全履歴を取得する
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 成果物をダウンロード
        uses: actions/download-artifact@v7
        with:
          path: assets
          # 各パッケージの成果物を 1 つのフォルダへ集約する（ファイル名は配布名のまま）
          merge-multiple: true

      - name: バージョンをコミット
        id: apply
        shell: pwsh
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VERSION_FILE: ${{ needs.verify.outputs.version_file }}
          UPDATE_VERSION_FILE: ${{ needs.verify.outputs.update_version_file }}
        run: |
          if ($env:UPDATE_VERSION_FILE -ne 'true') {
            # main からのバックポートでは、main のバージョンを旧系列へ戻さないようファイルを書き換えない
            Write-Host "バックポートのため、バージョンファイルは変更しません（main のバージョンを維持します）"
          }
          else {
            & ./.github/scripts/set-version.ps1 -Version $env:VERSION -VersionFile $env:VERSION_FILE | Out-Null

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            # publish の作業ツリーにのみ適用していた場合は、ここで初めて変更が生じる
            if (git status --porcelain) {
              git commit -am "リリースバージョンを $env:VERSION へ更新"
              Write-Host "バージョンをコミットしました"
            }
            else {
              Write-Host "バージョンは既に設定済みのため、コミットをスキップしました"
            }
          }

          "sha=$((git rev-parse HEAD).Trim())" >> $env:GITHUB_OUTPUT

      - name: ブランチを push
        shell: pwsh
        env:
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ steps.apply.outputs.sha }}
        run: |
          git push origin "HEAD:$env:BRANCH"
          Write-Host "push しました: $env:SHA -> $env:BRANCH"

      - name: GitHub Release を作成
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRODUCT: ${{ needs.verify.outputs.product }}
          RELEASE_NOTES: ${{ needs.verify.outputs.release_notes }}
          NOTES_START_TAG: ${{ needs.verify.outputs.notes_start_tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          MARK_LATEST: ${{ needs.verify.outputs.mark_latest }}
          SHA: ${{ steps.apply.outputs.sha }}
        run: |
          # 添付する配布物は publish ジョブが保管した nupkg（パッケージの定義に依存しない）
          $assets = @(Get-ChildItem -Path 'assets' -File -Filter '*.nupkg' | Select-Object -ExpandProperty FullName)
          if ($assets.Count -eq 0) { throw '添付する成果物がありません。' }

          # タグは gh に作成させる（--target で公開対象コミットを指定する）
          $ghArgs = @(
            'release', 'create', $env:TAG,
            '--title', "$env:PRODUCT $env:VERSION",
            '--target', $env:SHA,
            '--generate-notes'
          )

          # 先頭に付ける説明は設定（release-config.json）が持つ
          if ($env:RELEASE_NOTES) { $ghArgs += @('--notes', $env:RELEASE_NOTES) }
          # リリースノートは同じ系列の前回リリースからの差分にする（前回のタグを明示する）
          if ($env:NOTES_START_TAG) { $ghArgs += @('--notes-start-tag', $env:NOTES_START_TAG) }
          # プレリリースは Latest にしない
          if ($env:PRERELEASE -eq 'true') { $ghArgs += @('--prerelease') }
          # 旧系列（バックポート・系列ブランチ）は Latest にしない
          if ($env:MARK_LATEST -ne 'true') { $ghArgs += @('--latest=false') }

          $ghArgs += $assets

          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release の作成に失敗しました（exit $LASTEXITCODE）" }

          Write-Host "リリースを作成しました: $env:TAG（添付 $($assets.Count) 件）"

      # バージョンコミットは GITHUB_TOKEN の push では Build が起動しない（workflow_dispatch は例外として起動する）。
      # バージョンコミットの検証（ビルドとテスト）を行い、チェックを付けて次のリリースのゲートを満たす。
      - name: バージョンコミットの検証を起動
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          GATE_WORKFLOW: ${{ needs.verify.outputs.gate_workflow }}
        run: |
          $workflow = $env:GATE_WORKFLOW

          gh workflow run $workflow --ref $env:BRANCH
          if ($LASTEXITCODE -ne 0) { throw "$workflow の起動に失敗しました（exit $LASTEXITCODE）" }

          Write-Host "$workflow を起動しました（ブランチ: $env:BRANCH）"
          Write-Host "実行完了は待たない（Actions で結果を確認できる）"

      - name: 結果をまとめ
        if: always()
        shell: pwsh
        env:
          SUMMARY_VERSION: ${{ needs.verify.outputs.version }}
          SUMMARY_TAG: ${{ needs.verify.outputs.tag }}
          SUMMARY_SHA: ${{ steps.apply.outputs.sha }}
          SUMMARY_PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          SUMMARY_KIND: ${{ needs.verify.outputs.is_backport }}
        run: |
          # バックポートかどうかを表示用の文言にする
          $kind = if ($env:SUMMARY_KIND -eq 'true') { 'バックポート（バージョンファイルは変更しません）' } else { '通常のリリース' }

          # 注意: ダブルクォートの here-string では、バックティックがエスケープ文字になり、
          # `` `$env:X `` が展開されずリテラル（$env:X）になる。シングルクォート + -f で埋め込む。
          $message = @'
          ## リリース結果

          | 項目 | 値 |
          | --- | --- |
          | バージョン | `{0}` |
          | タグ | `{1}` |
          | 対象コミット | `{2}` |
          | プレリリース | {3} |
          | 種別 | {4} |
          '@ -f $env:SUMMARY_VERSION, $env:SUMMARY_TAG, $env:SUMMARY_SHA, $env:SUMMARY_PRERELEASE, $kind

          $message | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
